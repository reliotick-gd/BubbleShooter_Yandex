<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #f5eedc; overflow: hidden;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      /* Долгий тап на iOS Safari поднимает системное callout-меню поверх игры.
         user-select его не подавляет — нужен отдельно touch-callout (п.1.6). */
      -webkit-touch-callout: none;
    }
    #unity-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { width: 100%; height: 100%; touch-action: none; }
    /* Экран загрузки. Всё рисуется CSS-ом: ни одной картинки и ни одного внешнего
       ресурса — он показывается ДО того, как загрузился движок, и обязан появиться
       мгновенно; плюс внешние домены всё равно запрещены требованиями площадки.
       Палитра взята из игры (GameConfig): кремовый фон, тёплый коричневый текст,
       пастельные шары тех же цветов, что и зверята на поле. */
    #loading-overlay {
      position: fixed; inset: 0; background: #f5eedc; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #5a3e2e; z-index: 10;
      transition: opacity .45s ease;
    }
    /* Мягкие пятна фона — те же, что рисует CozyBackdrop в игре, чтобы переход
       с экрана загрузки в игру не читался как смена оформления. */
    #loading-overlay .blob {
      position: absolute; border-radius: 50%; filter: blur(6px); opacity: .55;
      animation: drift 18s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(18px, -26px) scale(1.06); }
    }
    #loading-card { position: relative; text-align: center; padding: 0 24px; }
    #loading-title {
      font-size: clamp(24px, 4.4vw, 38px); font-weight: 800; line-height: 1.25;
      letter-spacing: .2px; text-shadow: 0 2px 0 rgba(255,255,255,.6);
    }
    /* Ряд прыгающих шаров — он же индикатор «идёт загрузка». Для бабл-шутера это
       понятнее крутилки: сразу видно, из чего игра. */
    #loading-balls { display: flex; gap: 14px; justify-content: center; margin: 26px 0 22px; }
    #loading-balls i {
      width: 30px; height: 30px; border-radius: 50%; display: block; position: relative;
      box-shadow: inset 0 -5px 8px rgba(0,0,0,.13), 0 3px 6px rgba(90,62,46,.16);
      animation: hop 1.15s ease-in-out infinite;
    }
    /* Блик — та же «конфетная» подача, что у шаров на поле. */
    #loading-balls i::after {
      content: ''; position: absolute; left: 21%; top: 13%;
      width: 34%; height: 26%; border-radius: 50%;
      background: rgba(255,255,255,.75); filter: blur(.5px);
    }
    @keyframes hop {
      0%, 70%, 100% { transform: translateY(0) scale(1); }
      35%           { transform: translateY(-17px) scale(1.06); }
    }
    #loading-bar-bg {
      width: min(320px, 68vw); height: 14px; background: #e3d5b8;
      border-radius: 8px; margin: 0 auto; overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(90,62,46,.16);
    }
    #loading-bar {
      height: 100%; width: 0%; border-radius: 8px;
      background: linear-gradient(90deg, #f0a15c, #e87a5a);
      transition: width .25s ease; position: relative;
    }
    /* Блик, пробегающий по заполненной части: полоса не выглядит замершей, даже
       когда прогресс какое-то время стоит на месте. */
    #loading-bar::after {
      content: ''; position: absolute; inset: 0; border-radius: 8px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      transform: translateX(-100%);
      animation: sheen 1.6s linear infinite;
    }
    @keyframes sheen { to { transform: translateX(100%); } }
    #loading-text { margin-top: 14px; font-size: 15px; opacity: .85; }
    #loading-tip {
      margin-top: 10px; font-size: 14px; opacity: 0; min-height: 20px;
      color: #7d6350; transition: opacity .5s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      #loading-overlay .blob, #loading-balls i, #loading-bar::after { animation: none; }
    }
  </style>

  <!-- ── Яндекс.Метрика ─────────────────────────────────────────────────────
       ЗАГЛУШКА: страница игры ещё не создана. Когда появится счётчик Метрики,
       вписать его номер в YM_COUNTER_ID ниже — и всё заработает (события из игры
       уже шлются через Analytics.jslib → ym(...,'reachGoal',...)).
       Пока ID = 0: счётчик не грузится, события уходят в console.log. -->
  <script>
    window.YM_COUNTER_ID = 0; // TODO: вставить номер счётчика Яндекс.Метрики
    if (window.YM_COUNTER_ID) {
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
      ym(window.YM_COUNTER_ID, 'init', {
        clickmap: false,       // тепловая карта кликов бессмысленна на canvas
        trackLinks: false,
        accurateTrackBounce: true,
        defer: true            // визит начинаем сами — точнее для одностраничной игры
      });
      ym(window.YM_COUNTER_ID, 'hit', window.location.href);
    }
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div class="blob" style="width:38vmax;height:38vmax;left:-10vmax;top:-8vmax;background:#f7d9d9;animation-delay:-2s"></div>
    <div class="blob" style="width:30vmax;height:30vmax;right:-8vmax;top:6vmax;background:#fbe7c8;animation-delay:-7s"></div>
    <div class="blob" style="width:34vmax;height:34vmax;left:12vmax;bottom:-14vmax;background:#dcecd2;animation-delay:-11s"></div>
    <div class="blob" style="width:22vmax;height:22vmax;right:6vmax;bottom:-6vmax;background:#f3e2f5;animation-delay:-4s"></div>

    <div id="loading-card">
      <div id="loading-title">🐾 {{{ PRODUCT_NAME }}}</div>
      <div id="loading-balls">
        <i style="background:#f2646e;animation-delay:0s"></i>
        <i style="background:#f2b23e;animation-delay:.11s"></i>
        <i style="background:#6bd46b;animation-delay:.22s"></i>
        <i style="background:#7fc7f0;animation-delay:.33s"></i>
        <i style="background:#a16be0;animation-delay:.44s"></i>
      </div>
      <div id="loading-bar-bg"><div id="loading-bar"></div></div>
      <div id="loading-text">Загрузка…</div>
      <div id="loading-tip"></div>
    </div>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <!-- ── Yandex Games SDK: init ДО загрузки Unity ───────────────────────────
       Пока грузится сам движок, SDK уже готов (window.ysdk) — jslib-мост
       (YandexGames.jslib) читает язык синхронно и не ждёт промисов.
       Тег /sdk.js инжектируется программно В КОНЦЕ этого скрипта — чтобы initSDK
       была объявлена ДО того, как сработает onload (иначе гонка → ReferenceError). -->
  <script>
    var unityInstance = null;

    // п.1.6: контекстное меню браузера в игровой области должно быть отключено.
    // Вешаем на весь документ, а не только на канвас: правый клик по полям вокруг
    // канваса открывал бы меню ровно так же, а игровых элементов вне канваса нет.
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var loadingOverlay = document.getElementById('loading-overlay');
    var loadingBar = document.getElementById('loading-bar');
    var loadingText = document.getElementById('loading-text');
    var loadingTitle = document.getElementById('loading-title');

    // Локализуем лоадер СРАЗУ по языку браузера — SDK ещё грузится, а RU-игрок
    // уже видит русское название. После init SDK уточняется по i18n.lang.
    var RU_TITLE = '🐾 Шарики: Милые Зверята';
    var EN_TITLE = loadingTitle.textContent;   // '🐾 ' + PRODUCT_NAME из шаблона
    var isRuLang = function (l) { return /^(ru|be|kk|uk)/i.test(l || ''); };
    var ruLoader = isRuLang(navigator.language);
    var errText = function () { return ruLoader ? 'Ошибка загрузки' : 'Loading error'; };
    function applyLoaderLang() {
      loadingTitle.textContent = ruLoader ? RU_TITLE : EN_TITLE;
      loadingText.textContent  = ruLoader ? 'Загрузка…' : 'Loading…';
      showTip(0);
    }

    // Подсказки по очереди, пока идёт загрузка: ожидание превращается в объяснение
    // правил, и первый уровень начинается уже с пониманием, что делать.
    var TIPS_RU = [
      'Собери три одинаковых — они лопнут',
      'Целься в стену — шар отскочит',
      'Радуга подходит к любому цвету',
      'Бомба сносит всё вокруг себя'
    ];
    var TIPS_EN = [
      'Match three of a kind to pop them',
      'Aim at the wall — the ball bounces',
      'The rainbow fits any colour',
      'The bomb clears everything around it'
    ];
    var tipEl = document.getElementById('loading-tip');
    var tipIdx = 0;
    function showTip(i) {
      if (!tipEl) return;
      var list = ruLoader ? TIPS_RU : TIPS_EN;
      tipEl.textContent = list[i % list.length];
      tipEl.style.opacity = '1';
    }
    setInterval(function () {
      if (!tipEl || !loadingOverlay || loadingOverlay.style.display === 'none') return;
      tipEl.style.opacity = '0';
      setTimeout(function () { showTip(++tipIdx); }, 500);
    }, 3200);

    applyLoaderLang();

    // маленькая обёртка событий Метрики со страницы (до/вне Unity)
    function ymEvent(name, params) {
      try {
        if (window.YM_COUNTER_ID && typeof ym === 'function') {
          ym(window.YM_COUNTER_ID, 'reachGoal', name, params || {});
        } else {
          console.log('[YM stub]', name, JSON.stringify(params || {}));
        }
      } catch (e) { }
    }

    // Unity грузим ровно один раз, из какого бы колбэка/таймаута сюда ни пришли.
    var _booted = false;
    function bootUnity() {
      if (_booted) return;
      _booted = true;
      loadUnity();
    }

    function initSDK() {
      if (typeof YaGames === 'undefined') {
        console.warn('[YG] /sdk.js не загрузился (локальный запуск?) — Unity стартует без SDK');
        bootUnity();
        return;
      }
      // Таймаут на init(): если промис завис (блокировщик/сбой платформы) — не держим
      // игрока на вечном экране загрузки, стартуем Unity без SDK-фич (В-2).
      var timedOut = false;
      var to = setTimeout(function () {
        timedOut = true;
        console.warn('[YG] YaGames.init() не ответил за 10с — старт без ожидания SDK');
        bootUnity();
      }, 10000);
      YaGames.init().then(function (sdk) {
        window.ysdk = sdk;   // проставляем всегда — даже при позднем резолве jslib-мост подхватит
        var lang = 'en';
        try { lang = sdk.environment.i18n.lang || 'en'; } catch (e) { }
        console.log('[YG] SDK ready, lang =', lang);
        if (timedOut) return;              // Unity уже стартовала по таймауту
        clearTimeout(to);
        ruLoader = isRuLang(lang);         // уточняем язык лоадера по платформе
        applyLoaderLang();
        bootUnity();
      }).catch(function (e) {
        console.warn('[YG] YaGames.init() упал', e);
        if (timedOut) return;
        clearTimeout(to);
        bootUnity();
      });
    }

    function loadUnity() {
      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      // Передаём devicePixelRatio в Unity чтобы рендер совпадал с физическими пикселями
      // (без этого на ноутбуках с масштабом 125-150% картинка мыльная).
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement('script');
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onerror = function () { loadingText.textContent = errText(); };
      script.onload = function () {
        var t0 = performance.now();
        createUnityInstance(document.querySelector('#unity-canvas'), config, function (p) {
          loadingBar.style.width = (100 * p) + '%';
        }).then(function (instance) {
          unityInstance = instance;
          // Гасим плавно: резкое исчезновение читалось как рывок на стыке с титулом.
          loadingOverlay.style.opacity = '0';
          setTimeout(function () { loadingOverlay.style.display = 'none'; }, 450);
          // метрика скорости загрузки движка (секунды, округлённо)
          ymEvent('game_loaded', { load_seconds: Math.round((performance.now() - t0) / 1000) });
          // LoadingAPI.ready() зовёт сам Unity (YandexBridge.GameReady), когда
          // титульный экран реально на экране — тут его звать рано.
        }).catch(function (msg) {
          loadingText.textContent = errText();
          ymEvent('game_load_error', {});
          console.error(msg);
        });
      };
      document.body.appendChild(script);
    }

    // Требование Яндекса: звук прекращается при сворачивании страницы.
    // Мост глушит звук и стопит GameplayAPI (YandexBridge.OnVisibilityChanged).
    document.addEventListener('visibilitychange', function () {
      if (!unityInstance) return;
      unityInstance.SendMessage('YandexBridge', 'OnVisibilityChanged', document.hidden ? '1' : '0');
    });

    // Трек отвала «закрыл вкладку»: последний уровень запоминает Analytics.jslib
    // (window.__lastLevel), Метрика шлёт через sendBeacon — обычно успевает.
    window.addEventListener('pagehide', function () {
      ymEvent('session_end', { level: window.__lastLevel || 0 });
    });

    // Грузим SDK и запускаем инициализацию. Скрипт добавляется ПОСЛЕ объявления
    // initSDK/bootUnity — гонки «onload раньше объявления функции» быть не может (В-1).
    (function () {
      var s = document.createElement('script');
      s.src = '/sdk.js';
      s.onload = initSDK;
      s.onerror = initSDK;   // нет /sdk.js (локально) → initSDK стартует Unity без SDK
      document.head.appendChild(s);
    })();

    // Последняя страховка: что бы ни случилось со скриптом/колбэками — Unity стартует.
    setTimeout(bootUnity, 15000);
  </script>
</body>
</html>
