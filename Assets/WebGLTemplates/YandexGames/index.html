<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #f5eedc; overflow: hidden;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { width: 100%; height: 100%; touch-action: none; }
    #loading-overlay {
      position: fixed; inset: 0; background: #f5eedc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: sans-serif; color: #5a3e2e; z-index: 10;
    }
    #loading-title { font-size: 30px; font-weight: bold; text-align: center; line-height: 1.3; }
    #loading-bar-bg {
      width: 260px; height: 12px; background: #d9c8a8; border-radius: 6px; margin-top: 24px;
    }
    #loading-bar { height: 100%; background: #e87a5a; border-radius: 6px; width: 0%; transition: width 0.2s; }
    #loading-text { margin-top: 12px; font-size: 14px; }
  </style>

  <!-- ── Яндекс.Метрика ─────────────────────────────────────────────────────
       ЗАГЛУШКА: страница игры ещё не создана. Когда появится счётчик Метрики,
       вписать его номер в YM_COUNTER_ID ниже — и всё заработает (события из игры
       уже шлются через Analytics.jslib → ym(...,'reachGoal',...)).
       Пока ID = 0: счётчик не грузится, события уходят в console.log. -->
  <script>
    window.YM_COUNTER_ID = 0; // TODO: вставить номер счётчика Яндекс.Метрики
    if (window.YM_COUNTER_ID) {
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
      ym(window.YM_COUNTER_ID, 'init', {
        clickmap: false,       // тепловая карта кликов бессмысленна на canvas
        trackLinks: false,
        accurateTrackBounce: true,
        defer: true            // визит начинаем сами — точнее для одностраничной игры
      });
      ym(window.YM_COUNTER_ID, 'hit', window.location.href);
    }
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-title">🐾 {{{ PRODUCT_NAME }}}</div>
    <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    <div id="loading-text">Загрузка…</div>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <!-- ── Yandex Games SDK: init ДО загрузки Unity ───────────────────────────
       Пока грузится сам движок, SDK уже готов (window.ysdk) — jslib-мост
       (YandexGames.jslib) читает язык синхронно и не ждёт промисов.
       Тег /sdk.js инжектируется программно В КОНЦЕ этого скрипта — чтобы initSDK
       была объявлена ДО того, как сработает onload (иначе гонка → ReferenceError). -->
  <script>
    var unityInstance = null;
    var loadingOverlay = document.getElementById('loading-overlay');
    var loadingBar = document.getElementById('loading-bar');
    var loadingText = document.getElementById('loading-text');
    var loadingTitle = document.getElementById('loading-title');

    // Локализуем лоадер СРАЗУ по языку браузера — SDK ещё грузится, а RU-игрок
    // уже видит русское название. После init SDK уточняется по i18n.lang.
    var RU_TITLE = '🐾 Шарики: Милые Зверята';
    var EN_TITLE = loadingTitle.textContent;   // '🐾 ' + PRODUCT_NAME из шаблона
    var isRuLang = function (l) { return /^(ru|be|kk|uk)/i.test(l || ''); };
    var ruLoader = isRuLang(navigator.language);
    var errText = function () { return ruLoader ? 'Ошибка загрузки' : 'Loading error'; };
    function applyLoaderLang() {
      loadingTitle.textContent = ruLoader ? RU_TITLE : EN_TITLE;
      loadingText.textContent  = ruLoader ? 'Загрузка…' : 'Loading…';
    }
    applyLoaderLang();

    // маленькая обёртка событий Метрики со страницы (до/вне Unity)
    function ymEvent(name, params) {
      try {
        if (window.YM_COUNTER_ID && typeof ym === 'function') {
          ym(window.YM_COUNTER_ID, 'reachGoal', name, params || {});
        } else {
          console.log('[YM stub]', name, JSON.stringify(params || {}));
        }
      } catch (e) { }
    }

    // Unity грузим ровно один раз, из какого бы колбэка/таймаута сюда ни пришли.
    var _booted = false;
    function bootUnity() {
      if (_booted) return;
      _booted = true;
      loadUnity();
    }

    function initSDK() {
      if (typeof YaGames === 'undefined') {
        console.warn('[YG] /sdk.js не загрузился (локальный запуск?) — Unity стартует без SDK');
        bootUnity();
        return;
      }
      // Таймаут на init(): если промис завис (блокировщик/сбой платформы) — не держим
      // игрока на вечном экране загрузки, стартуем Unity без SDK-фич (В-2).
      var timedOut = false;
      var to = setTimeout(function () {
        timedOut = true;
        console.warn('[YG] YaGames.init() не ответил за 10с — старт без ожидания SDK');
        bootUnity();
      }, 10000);
      YaGames.init().then(function (sdk) {
        window.ysdk = sdk;   // проставляем всегда — даже при позднем резолве jslib-мост подхватит
        var lang = 'en';
        try { lang = sdk.environment.i18n.lang || 'en'; } catch (e) { }
        console.log('[YG] SDK ready, lang =', lang);
        if (timedOut) return;              // Unity уже стартовала по таймауту
        clearTimeout(to);
        ruLoader = isRuLang(lang);         // уточняем язык лоадера по платформе
        applyLoaderLang();
        bootUnity();
      }).catch(function (e) {
        console.warn('[YG] YaGames.init() упал', e);
        if (timedOut) return;
        clearTimeout(to);
        bootUnity();
      });
    }

    function loadUnity() {
      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      // Передаём devicePixelRatio в Unity чтобы рендер совпадал с физическими пикселями
      // (без этого на ноутбуках с масштабом 125-150% картинка мыльная).
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement('script');
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onerror = function () { loadingText.textContent = errText(); };
      script.onload = function () {
        var t0 = performance.now();
        createUnityInstance(document.querySelector('#unity-canvas'), config, function (p) {
          loadingBar.style.width = (100 * p) + '%';
        }).then(function (instance) {
          unityInstance = instance;
          loadingOverlay.style.display = 'none';
          // метрика скорости загрузки движка (секунды, округлённо)
          ymEvent('game_loaded', { load_seconds: Math.round((performance.now() - t0) / 1000) });
          // LoadingAPI.ready() зовёт сам Unity (YandexBridge.GameReady), когда
          // титульный экран реально на экране — тут его звать рано.
        }).catch(function (msg) {
          loadingText.textContent = errText();
          ymEvent('game_load_error', {});
          console.error(msg);
        });
      };
      document.body.appendChild(script);
    }

    // Требование Яндекса: звук прекращается при сворачивании страницы.
    // Мост глушит звук и стопит GameplayAPI (YandexBridge.OnVisibilityChanged).
    document.addEventListener('visibilitychange', function () {
      if (!unityInstance) return;
      unityInstance.SendMessage('YandexBridge', 'OnVisibilityChanged', document.hidden ? '1' : '0');
    });

    // Трек отвала «закрыл вкладку»: последний уровень запоминает Analytics.jslib
    // (window.__lastLevel), Метрика шлёт через sendBeacon — обычно успевает.
    window.addEventListener('pagehide', function () {
      ymEvent('session_end', { level: window.__lastLevel || 0 });
    });

    // Грузим SDK и запускаем инициализацию. Скрипт добавляется ПОСЛЕ объявления
    // initSDK/bootUnity — гонки «onload раньше объявления функции» быть не может (В-1).
    (function () {
      var s = document.createElement('script');
      s.src = '/sdk.js';
      s.onload = initSDK;
      s.onerror = initSDK;   // нет /sdk.js (локально) → initSDK стартует Unity без SDK
      document.head.appendChild(s);
    })();

    // Последняя страховка: что бы ни случилось со скриптом/колбэками — Unity стартует.
    setTimeout(bootUnity, 15000);
  </script>
</body>
</html>
